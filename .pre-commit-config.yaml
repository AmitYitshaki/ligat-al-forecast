repos:
  - repo: local
    hooks:
      - id: nbstripout
        name: Strip notebook outputs
        entry: python -m nbstripout
        language: system
        types: [jupyter]
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Mypy
        entry: python -m mypy ligat
        language: system
        pass_filenames: false
        types: [python]
