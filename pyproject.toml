[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ligat-al-forecast"
version = "0.1.0"
description = "Probabilistic forecasts for the Israeli Premier League"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32", "beautifulsoup4>=4.12", "lxml>=5",
    "PyYAML>=6", "pydantic>=2", "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9", "mypy>=1.14", "pytest>=8", "pytest-cov>=6",
    "pre-commit>=4", "pip-tools>=7", "types-requests", "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["ligat*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
